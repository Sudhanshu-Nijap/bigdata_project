<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Twitter Sentiment Analysis Dashboard{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Clean CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Clean Minimalist Navbar -->
    <header class="navbar-custom mb-3">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a class="brand-title" href="{{ url_for('dashboard') }}">
                📊 Real-Time Twitter Sentiment Analysis
            </a>
            
            <nav class="d-flex align-items-center gap-2">
                <a class="nav-link-custom {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                    Live Dashboard
                </a>
                <a class="nav-link-custom {% if request.endpoint == 'classify' %}active{% endif %}" href="{{ url_for('classify') }}">
                    Test Classifier
                </a>
                <a class="nav-link-custom {% if request.endpoint == 'how_it_works_page' %}active{% endif %}" href="{{ url_for('how_it_works_page') }}">
                    💡 How It Works
                </a>
                <a class="nav-link-custom" href="{{ url_for('health_check') }}" target="_blank">
                    API Health
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container mb-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Minimalist Footer -->
    <footer class="footer-clean text-center">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                Big Data Pipeline &bull; Apache Kafka &bull; PySpark MLlib &bull; MongoDB &bull; Flask
            </div>
            <div>
                Real-Time Streaming Analytics
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
